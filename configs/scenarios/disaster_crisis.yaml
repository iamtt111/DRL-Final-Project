duration_minutes: 10
total_passengers: 200
flow_distribution:
  incoming: 0.40
  outgoing: 0.40
  interfloor: 0.20
arrival_pattern: "poisson"
peak_multiplier: 1.5
# 提升優先事件發生率進行極端超載壓力測試
priority_events:
  emergency_rate: 0.03    # 提升 6 倍 (從預設 0.005 提升至 0.03)，模擬大量急診床湧入
  staff_rate: 0.02        # 提升 2 倍
  wheelchair_rate: 0.02   # 提升約 1.3 倍
